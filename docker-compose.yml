services:
  api:
    build: .
    ports:
      - "${PORT:-3002}:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      MONGO_URI: mongodb://mongo:27017/arautomation
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      DISABLE_WORKERS: ${DISABLE_WORKERS:-false}
      BULL_BOARD_PATH: ${BULL_BOARD_PATH:-/api/admin/queues}
      BULL_BOARD_USERNAME: ${BULL_BOARD_USERNAME:-}
      BULL_BOARD_PASSWORD: ${BULL_BOARD_PASSWORD:-}
      BULL_BOARD_READ_ONLY: ${BULL_BOARD_READ_ONLY:-false}
      ECOBILLZ_API_BASE_URL: ${ECOBILLZ_API_BASE_URL:-}
      ECOBILLZ_MERCHANT_ID: ${ECOBILLZ_MERCHANT_ID:-}
      ECOBILLZ_OUTLET_ID: ${ECOBILLZ_OUTLET_ID:-}
      ECOBILLZ_AR_POSTED_ENTRIES_PATH: ${ECOBILLZ_AR_POSTED_ENTRIES_PATH:-}
      ECOBILLZ_INVOICES_PATH: ${ECOBILLZ_INVOICES_PATH:-}
      ECOBILLZ_GET_CHEQUES_PATH: ${ECOBILLZ_GET_CHEQUES_PATH:-}
      DOCUMENTS_API_URL: ${DOCUMENTS_API_URL:-}
      AR_DAILY_CRON: ${AR_DAILY_CRON:-0 2 * * *}
      AR_DAILY_TZ: ${AR_DAILY_TZ:-Asia/Kolkata}
      AR_DAILY_DISABLED: ${AR_DAILY_DISABLED:-false}
      AR_DAILY_TARGETS: ${AR_DAILY_TARGETS:-[]}
      AR_INVOICE_DATE_PROXIMITY_DAYS: ${AR_INVOICE_DATE_PROXIMITY_DAYS:-3}
      STORAGE_DIR: /app/storage
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    volumes:
      - pdf_storage:/app/storage
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  mongo:
    image: mongo:7
    ports:
      - "${MONGO_HOST_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "mongodb://127.0.0.1:27017/test", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mongo_data:
  pdf_storage:
